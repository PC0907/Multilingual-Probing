# Language configuration
#
# Two jobs:
#   1. Define the language set and its tiers (core / extended).
#   2. Declare the RQ2 covariates and where each one comes from.
#
# Design principle: this set is chosen to DISSOCIATE covariates, not to maximise
# coverage. With ~6 languages you cannot fit a regression that separates five
# collinear predictors. What you can do is pick pairs where one factor varies and
# the others are held roughly fixed, and read the contrasts directly.
#
# The dissociations this set buys:
#   hi vs ur   same language family, near-identical spoken language,
#              DIFFERENT SCRIPT (Devanagari vs Perso-Arabic).
#              -> isolates script/tokenizer from typology. This is the single
#                 most valuable pair available and the reason ur is core.
#   hi vs ta   both Indian, similar resource level, DIFFERENT FAMILY
#              (Indo-Aryan vs Dravidian).
#              -> isolates typological distance from region.
#   es vs hi   both Indo-European, both Latin-ish resource asymmetry,
#              VERY DIFFERENT PRETRAINING SHARE.
#              -> isolates resource level from family.
#   en         pivot / reference language for all transfer directions.
#
# NOTE ON FERTILITY: tokenizer fertility is a property of the (language, model)
# pair, not of the language. It is NOT hardcoded here. src/transfer/covariates.py
# computes it per model over a fixed parallel corpus and writes to
# results/tables/fertility_{model}.csv. Anything hardcoded would be wrong for
# half the models.

version: 1

# ---------------------------------------------------------------------------
# Core set — everything is run on these. Native statement data is built for all.
# ---------------------------------------------------------------------------
core:
  - code: en
    name: English
    script: Latn
    family: Indo-European
    genus: Germanic
    role: pivot
    locality_regions: [Q145, Q30]        # UK, USA — Wikidata QIDs
    resource_tier: 5                      # Joshi et al. (2020) taxonomy
    notes: >
      Reference language. All transfer directions are reported relative to en,
      and the split-half en ceiling normalises every alignment number.

  - code: hi
    name: Hindi
    script: Deva
    family: Indo-European
    genus: Indo-Aryan
    role: target
    locality_regions: [Q1149, Q1479, Q1445]   # UP, MP, Rajasthan (adjust)
    resource_tier: 4
    notes: >
      Paired with ur for the script dissociation. Note MultiLoKo finds hi gets
      EASIER when its local questions are translated to English, suggesting
      proficiency rather than data difficulty is the binding constraint.

  - code: ur
    name: Urdu
    script: Arab
    family: Indo-European
    genus: Indo-Aryan
    role: target
    locality_regions: [Q843, Q4478]           # Pakistan, Sindh (adjust)
    resource_tier: 3
    notes: >
      The point of the whole design. Mutually intelligible with hi in speech,
      different script, lower resource. If transfer tracks script it should
      diverge sharply from hi; if it tracks typology it should not.

  - code: ta
    name: Tamil
    script: Taml
    family: Dravidian
    genus: Southern Dravidian
    role: target
    locality_regions: [Q1445, Q854]           # Tamil Nadu, Sri Lanka (verify)
    resource_tier: 3
    notes: >
      NOT PRESENT IN MULTILOKO. The native slice for ta must come entirely from
      Wikidata templating plus our own annotation. This is a real cost — budget
      for it, or drop ta and lose the family dissociation.

  - code: es
    name: Spanish
    script: Latn
    family: Indo-European
    genus: Romance
    role: control
    locality_regions: [Q29, Q96]              # Spain, Mexico
    resource_tier: 5
    notes: >
      High-resource non-English control. If alignment is high for es and low for
      ta, resource level is doing the work. Also the sanity check: if es does not
      align with en, something is wrong with the pipeline, not the world.

# ---------------------------------------------------------------------------
# Extended set — only if the core pipeline is done and time remains.
# Do not start these until the content-disjoint control has been run on core.
# ---------------------------------------------------------------------------
extended:
  - code: bn
    name: Bengali
    script: Beng
    family: Indo-European
    genus: Indo-Aryan
    resource_tier: 3
    notes: In MultiLoKo. Cheapest addition — adds a third Indo-Aryan point.

  - code: mr
    name: Marathi
    script: Deva
    family: Indo-European
    genus: Indo-Aryan
    resource_tier: 3
    notes: >
      In MultiLoKo. Shares Devanagari with hi but is a distinct language —
      a second, weaker version of the script/typology dissociation.

  - code: ar
    name: Arabic
    script: Arab
    family: Afro-Asiatic
    genus: Semitic
    resource_tier: 5
    notes: >
      Shares script with ur but nothing else. Also the language CrossHallu used,
      so including it gives a direct comparison point against their numbers.

# ---------------------------------------------------------------------------
# RQ2 covariates: what each is, where it comes from, and its known weakness.
# Every one of these needs its weakness stated in the paper.
# ---------------------------------------------------------------------------
covariates:

  tokenizer_fertility:
    description: Mean tokens per word, relative to English, for a given model.
    source: computed
    computed_by: src/transfer/covariates.py
    corpus: FLORES-200 devtest (parallel, so content is held constant)
    per_model: true
    weakness: >
      Fertility is confounded with resource level — low-resource languages are
      both badly tokenised and rare in pretraining. These two regressors will be
      collinear and cannot be separated with this many languages. Report both,
      claim neither causally.

  typological_distance:
    description: Distance from the training language in lang2vec feature space.
    source: lang2vec / URIEL (Littell et al., EACL 2017)
    features: [syntax_knn, phonology_knn, inventory_knn, genetic, geographic]
    default_feature: syntax_knn
    weakness: >
      URIEL coverage is uneven and partly imputed from related languages, so
      distances for lower-resource entries are less reliable than they look.
      Report which feature set was used; results can shift between them.

  script_identity:
    description: Categorical — writing system of the language.
    source: this file (ISO 15924 codes above)
    weakness: >
      With 5 core languages this is 4 categories and is nearly a language
      indicator. It is only interpretable through the hi/ur contrast, not as a
      regression term.

  resource_tier:
    description: Joshi et al. (2020) 0–5 taxonomy of language resource level.
    source: this file
    weakness: Coarse, dated, and not model-specific.

  pretraining_share:
    description: Estimated proportion of the model's pretraining data.
    source: proxy
    proxy: >
      Unpublished for most open models. Documented proxy: language share of
      CommonCrawl (CC-100 / OSCAR published proportions), noted explicitly as a
      stand-in in the paper. Do not present as measured.
    weakness: >
      The single weakest regressor. A reviewer will challenge it. Pre-empt by
      reporting the regression with and without it.

  in_language_probe_accuracy:
    description: How well a probe trained AND tested in language L performs.
    source: computed
    computed_by: scripts/04_transfer.py
    weakness: >
      Not an independent predictor — it is a ceiling on transfer. A probe cannot
      transfer into a language better than it works within it. Include it to
      control for that ceiling, not as an explanatory variable.

  geometric_alignment:
    description: RQ1 normalised alignment between the two languages' directions.
    source: computed
    computed_by: scripts/03_geometry.py
    weakness: >
      This is the regressor the paper is actually about. The hypothesis is that
      it does NOT predict transfer. Enter it last and report the change in
      explained variance when it is added.

# ---------------------------------------------------------------------------
# Statement types built per language. Several are required: a probe trained on
# one topic can learn a topic classifier rather than a truth direction.
# ---------------------------------------------------------------------------
statement_types:
  - id: geography
    description: Entity located in administrative region.
    wikidata_property: P131
    templatable: true

  - id: comparison
    description: Numeric comparison between two entities (population, area, year).
    wikidata_property: [P1082, P2046, P571]
    templatable: true

  - id: institution
    description: Organisation headquartered in / founded in place.
    wikidata_property: [P159, P571]
    templatable: true

  - id: person
    description: Person born in / died in / occupation.
    wikidata_property: [P19, P20, P106]
    templatable: true

  - id: cultural
    description: >
      Literature, history, cultural practice. NOT templatable — this is where
      models actually hallucinate and where the annotation budget goes.
    templatable: false
    requires_annotation: true
    second_annotator_required: true

# ---------------------------------------------------------------------------
# Dataset construction constraints. Violating any of these silently invalidates
# the geometry measurements.
# ---------------------------------------------------------------------------
constraints:
  negation_pairs_required: true      # 2D subspace needs the affirmative/negated axis
  matched_surface_form: true         # true/false differ only by swapped entity
  balanced_labels: true
  min_statements_per_type: 500       # revisit after the English scaling curve
  content_disjoint_split: true       # en set A vs target set B, different facts
  difficulty_matched_across_languages: true
  # ^ Content-disjoint must not become difficulty-disjoint. Same templates,
  #   different entities. Otherwise any alignment difference is uninterpretable.
