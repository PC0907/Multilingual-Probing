# Model configuration
#
# Model choice is a design decision, not a default. Three constraints bind:
#
# 1. INDIC COVERAGE. A model that saw almost no Tamil will have no readable truth
#    signal in Tamil, and then every "en -> ta transfer failed" cell is
#    uninterpretable (see the diagonal warning in scripts/04_transfer.py). Check
#    the in-language diagonal BEFORE reading any transfer result.
#
# 2. THE PIVOT QUESTION IS MODEL-SPECIFIC. Wendler et al. characterised the
#    latent-English pivot on Llama-2. Including at least one model from a
#    different training lineage is what turns RQ3's verification step into a
#    finding rather than a formality.
#
# 3. ARCHITECTURE ACCESS. The ablation hook in src/pivot/ablate.py registers on
#    decoder blocks and needs the final layer norm. Paths differ between
#    architectures; they are recorded per model below.
#
# VALUES MARKED `verify: true` HAVE NOT BEEN CHECKED AGAINST THE LOADED MODEL.
# Layer counts and hidden dimensions here are from memory and may be wrong.
# Run scripts/00_verify_models.py (not yet written) or simply load the config and
# compare against `model.config` before trusting anything. A wrong layer count
# will not error — it will silently truncate the layer sweep.

version: 1

defaults:
  dtype: bfloat16              # activations still cached as float32; see 02_extract
  max_length: 128
  batch_size: 16
  padding_side: left           # REQUIRED — pool_tokens raises otherwise

models:

  - id: meta-llama/Llama-3.1-8B
    short: llama31-8b
    n_layers: 32
    hidden_dim: 4096
    verify: true
    lineage: llama
    final_norm_path: model.norm
    block_path: model.layers
    indic_coverage: weak
    notes: >
      Closest available successor to the Llama-2 models Wendler characterised, so
      it is the natural place to test whether the pivot survives a tokenizer and
      training-mix change. Indic coverage is thin — expect a weak Tamil diagonal
      and check it before interpreting transfer into Tamil.

  - id: google/gemma-2-9b
    short: gemma2-9b
    n_layers: 42
    hidden_dim: 3584
    verify: true
    lineage: gemma
    final_norm_path: model.norm
    block_path: model.layers
    indic_coverage: moderate
    notes: >
      Different lineage from Llama, larger multilingual share. Note Gemma-2 uses
      alternating local/global attention and logit soft-capping; the logit lens in
      src/pivot/verify.py may need the soft-cap applied before softmax, or
      probabilities will be miscalibrated in a depth-dependent way. Check before
      running the pivot verification on this model.

  - id: CohereForAI/aya-expanse-8b
    short: aya-8b
    n_layers: 32
    hidden_dim: 4096
    verify: true
    lineage: cohere
    final_norm_path: model.norm
    block_path: model.layers
    indic_coverage: moderate
    notes: >
      Explicitly multilingual training objective, which makes it the best
      candidate for a strong in-language diagonal across the target set. Also the
      most interesting case for RQ3: if a deliberately multilingual model shows
      LESS English pivoting than Llama, that is a result about training rather
      than architecture.

  - id: Qwen/Qwen2.5-7B
    short: qwen25-7b
    n_layers: 28
    hidden_dim: 3584
    verify: true
    lineage: qwen
    final_norm_path: model.norm
    block_path: model.layers
    indic_coverage: weak
    notes: >
      Optional fourth model. Strong on Chinese and English, weak on Indic
      languages — useful mainly as a negative control for coverage effects, not
      as a primary model.

# ---------------------------------------------------------------------------
# Which models to actually run, and in what order.
# ---------------------------------------------------------------------------
run_plan:
  primary: aya-8b
  # Rationale: the whole study is downstream of having a readable truth signal in
  # each target language. Start with the model most likely to have one. If the
  # Tamil diagonal is at chance even here, the language set is the problem, not
  # the model.

  secondary: [llama31-8b, gemma2-9b]
  # Two more lineages. Bao et al. (Findings ACL 2025) report that truth-direction
  # structure is not consistent across models and is stronger in more capable
  # ones — so a finding on one model is a finding about that model. Three
  # lineages is the minimum for any claim phrased as "models".

  optional: [qwen25-7b]

# ---------------------------------------------------------------------------
# Checks to run before committing compute to a model.
# ---------------------------------------------------------------------------
preflight:
  - name: config_matches
    description: >
      Load the model and assert n_layers and hidden_dim match this file. A wrong
      layer count silently truncates the sweep rather than erroring.

  - name: tokenizer_left_padding
    description: >
      tokenizer.padding_side must be settable to "left" and pad_token must exist.
      With right padding, `last` pooling returns the pad embedding for every
      statement and the probe trains on a constant.

  - name: in_language_diagonal
    description: >
      Train and test a probe within each target language. Any language whose
      diagonal AUROC is below ~0.6 cannot support a transfer claim — a low
      en -> L cell would mean "L has no readable truth signal", not "transfer
      failed". Record the diagonal and report it beside every transfer table.

  - name: fertility
    description: >
      Compute tokenizer fertility over FLORES-200 devtest for every target
      language. This is per (language, model) and must be recomputed for each
      model — see src/transfer/covariates.compute_fertility.

  - name: pivot_verification
    description: >
      Run src/pivot/verify.py with control languages. Only if it reports a
      control-adjusted replication does RQ3's ablation have an object.
